<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">    
    <title>iChat - Auth & DB</title>
</head>

<body>
    <h1 class="title">iChat 💬</h1>

    <!-- AUTHENTICATION FORM -->
    <div id="auth-container" class="auth-box">
        <h2>Login / Register</h2>
        <input type="text" id="auth-username" placeholder="Username" maxlength="20">
        <input type="password" id="auth-password" placeholder="Password">
        <div class="auth-buttons">
            <button onclick="handleAuth('login', document.getElementById('auth-username').value, document.getElementById('auth-password').value)">Login</button>
            <button onclick="handleAuth('register', document.getElementById('auth-username').value, document.getElementById('auth-password').value)">Register</button>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div class="main" id="chat-main" style="display: none;">
        <div class="name">
            <span><i class="far fa-user"></i></span>
            <span id="logged-username" class="name-display">Username</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <ul class="message-container" id="message-container"></ul>

        <form class="message-form" id="message-form">
            <select id="recipient-select" class="recipient-select">
                <option value="all">Everyone (Group)</option>
            </select>
            <div class="v-divider"></div>
            <input type="text" name="message" id="message-input" class="message-input" placeholder="Message">
            <div class="v-divider"></div>
            <button type="submit" class="send-button"><span><i class="fas fa-paper-plane"></i></span></button>
        </form>
    </div>

    <h3 class="clients-total" id="client-total">Total clients: 0</h3>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
