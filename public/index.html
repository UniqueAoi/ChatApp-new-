<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iChat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="header">
        <h1>iChat <i class="fas fa-comment-dots"></i></h1>
    </div>

    <!-- Auth Container -->
    <div id="auth-container" class="auth-card">
        <h2 id="auth-title">Login</h2>

        <input type="text" id="auth-username" placeholder="Username">
        <input type="password" id="auth-password" placeholder="Password">
        <button onclick="submitAuth()">Submit</button>
        <p onclick="toggleAuthMode()" id="auth-toggle">Need an account? Register</p>
    </div>

    <!-- Main Chat Split Interface -->
    <div id="chat-main" class="chat-wrapper" style="display: none;">
        <!-- Sidebar -->
        <div class="chat-sidebar">
            <div class="user-header">
                <div class="user-info">
                    <img id="logged-avatar" src="" alt="Avatar" class="profile-avatar">
                    <span id="logged-username"></span>
                </div>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" id="user-search-input" placeholder="Search registered users..."
                    onkeyup="handleUserSearch()">
            </div>

            <!-- Channels & DM Users -->
            <div class="chat-channels">
                <div class="channel-item active" id="channel-group"
                    onclick="switchChatContext('all', 'Everyone (Group)')">
                    🌐 Everyone (Group)
                </div>
                <h4 style="color: rgb(232, 252, 245); font-size: 18px;">Direct Messages</h4>
                <ul id="user-list-container"></ul>
            </div>
            <div id="client-total">Total Clients: 0</div>
        </div>

        <!-- Chat Main Container -->
        <div class="chat-window">
            <div class="chat-header">
                <h4 id="current-chat-title">Everyone (Group)</h4>
            </div>
            <ul id="message-container" class="message-container"></ul>
            <form id="message-form" class="message-form">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>

</html>
