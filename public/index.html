<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">    
    <title>Chat App</title>
</head>

<body>
    <h1 class="title">iChat 💬</h1>
    <div class="main">
        <div class="name">
            <span><i class="far fa-user"></i></span>
            <input type="text" id="name-input" class="name-input" value="anonymous" maxlength="20">
        </div>
        <ul class="message-container" id="message-container">
            <li class="message-left">
                <p class="message">
                    Lorem ipsum 
                    <span>bluebird • 26 July 10:40</span>
                </p>
            </li>

            <li class="message-right">
                <p class="message">
                    Lorem ipsum
                    <span>bluebird • 26 July 10:40</span>
                </p>
            </li>

            <li class="message-feedback">
                <p class="feedback" id="feedback">
                    Nezuko is typing a message...
                </p>
            </li>
        </ul>

        <form class="message-form" id="message-form">
            <input type="text" name="message" id="message-input" class="message-input" placeholder="Message">
            <div class="v-divider"></div>
            <button type="sunmit" class="send-button">
                send <span><i class="fas fa-paper-plane"></i></span>
            </button>
        </form>
        
    </div>
     <h3 class="clients-total" id="client-total">Total clients:2</h3>

     <script src="/socket.io/socket.io.js"></script>
     <script src="main.js"></script>
</body>

</html>
